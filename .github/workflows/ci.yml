name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and API tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Install Bicep CLI
        run: az bicep install

      - name: Compile production Bicep
        run: az bicep build --file ./infra/main.bicep --stdout > /dev/null

      - name: Verify Bicep formatting
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            az bicep format --file "$file"
          done < <(find infra -name '*.bicep' -print)
          git diff --exit-code -- infra

      - name: Build production container
        run: docker build --tag cwp-analyzer:${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cwp-analyzer:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload container scan
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: cwp-analyzer:${{ github.sha }}
          format: spdx-json
          output-file: cwp-analyzer-sbom.spdx.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload SBOM
        if: always() && hashFiles('cwp-analyzer-sbom.spdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cwp-analyzer-sbom
          path: cwp-analyzer-sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
